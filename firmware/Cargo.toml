[package]
name = "firmware"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.77"

# Own workspace root so the esp (Xtensa) toolchain never mixes with the host
# x86 workspace at the repo root.
[workspace]

[[bin]]
name = "firmware"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[features]
default = ["std", "embassy", "esp-idf-svc/native"]
std = ["alloc", "esp-idf-svc/binstart", "esp-idf-svc/std"]
alloc = ["esp-idf-svc/alloc"]
embassy = ["esp-idf-svc/embassy-sync", "esp-idf-svc/critical-section", "esp-idf-svc/embassy-time-driver"]

[dependencies]
log = "0.4"
anyhow = "1"
serde_json = "1"
esp-idf-svc = { version = "0.49", default-features = false }
esp-idf-hal = "0.44"
embedded-svc = "0.28"
embedded-can = "0.4"

# Shared logic — identical code to the host simulator, different impls.
meb-proto = { path = "../crates/meb-proto" }
collector = { path = "../crates/collector" }

[build-dependencies]
embuild = "0.32"
